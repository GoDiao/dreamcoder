name: Release

# Pushing a v* tag builds the installers and uploads them to a draft release
# for review. Pull requests that touch this file run the same builds without
# releasing, so the workflow can be checked before a tag is pushed.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml', 'scripts/release.ts', 'scripts/prepare-ripgrep.ts', 'desktop/electron-builder.json', 'desktop/electron/build/**']

permissions:
  contents: write

jobs:
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi
          cat >> notes.md <<'EOF'

          ## Install

          The installers are not code-signed yet.

          - **macOS (Apple Silicon)**: open the `.dmg` and drag DreamCoder to Applications. On first launch macOS blocks the app; open **System Settings → Privacy & Security** and click **Open Anyway**. If macOS says the app is damaged, run `xattr -dr com.apple.quarantine /Applications/DreamCoder.app` and open it again.
          - **Windows x64**: run the `-setup.exe`. If SmartScreen appears, click **More info → Run anyway**.

          Both installers are installed, launched and checked automatically in CI before release. Reports from real machines are welcome in [issues](https://github.com/GoDiao/dreamcoder/issues).
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets to it."
          else
            prerelease=()
            case "$version" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$TAG" --draft "${prerelease[@]}" --verify-tag --title "DreamCoder $TAG" --notes-file notes.md
          fi

  build:
    needs: draft
    if: always() && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: --mac
            asset: '*.dmg'
          - os: windows-latest
            platform: --win
            asset: '*-setup.exe'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          (cd vendor/showai && bun install --frozen-lockfile)
          cd desktop && bun install --frozen-lockfile
          bun run electron:install

      - name: Build the app
        working-directory: desktop
        run: |
          bun run build
          bun run build:sidecars
          bun run build:electron

      # Without a signing certificate in the repository secrets, macOS builds are
      # ad-hoc signed and Windows builds are unsigned. With the secrets set,
      # electron-builder signs both and notarizes the macOS app.
      - name: Build installer
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            [ -n "${!name}" ] || unset "$name"
          done
          args=(--publish never ${{ matrix.platform }})
          if [ "$RUNNER_OS" = macOS ] && [ -z "$CSC_LINK" ]; then
            args+=(-c.mac.identity=-)
          fi
          bun x electron-builder "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: dreamcoder-${{ runner.os }}
          path: desktop/electron-release/${{ matrix.asset }}
          if-no-files-found: error

      - name: Upload to draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" desktop/electron-release/${{ matrix.asset }} --clobber

  smoke:
    needs: build
    if: github.event_name == 'push'
    uses: ./.github/workflows/smoke-test.yml
    with:
      tag: ${{ github.ref_name }}
