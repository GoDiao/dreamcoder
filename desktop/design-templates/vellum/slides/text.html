<section class="slide light slide--text">
  <header class="slide-chrome">
    <span class="label">[Field Note]</span>
    <span class="label slide-number"></span>
  </header>
  <div class="slide-body" style="display: flex; flex-direction: column; justify-content: center; align-items: center; gap: var(--gap-md); text-align: center; padding: 0 154px">
    <span class="kicker">Observation</span>
    <h2 class="h2">
      What you remove is louder<br>than what you keep.
    </h2>
    <p class="lead" style="max-width: 64ch; color: var(--c-fg-2)">
      Subtraction creates the figure. Addition only fills the ground. Working drafts always carry more than they need; the work of editing is mostly the work of cutting.
    </p>
  </div>
  <div class="pin-annotation">
    <span class="pin-note page-number"></span>
    <span class="pin-note">Show, don't tell.</span>
  </div>
</section>
