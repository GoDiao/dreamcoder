<section class="slide slide--chart dark">
  <header class="slide-chrome">
    <span class="label muted">§ [Metrics]</span>
    <span class="label muted slide-number"></span>
  </header>
  <div class="slide-body">
    <div class="chart-header">
      <h2 class="h2">
        Chart headline with emphasis
      </h2>
      <span class="caption muted">[Unit] · [Scope] · [Period]</span>
    </div>
    <div class="chart-wrapper">
      <div class="bar-track">
        <div class="bar-col">
          <span class="bar-val">[A]</span>
          <div class="bar-fill" style="height: 141px"></div>
          <span class="bar-x-label">[T1]</span>
        </div>
        <div class="bar-col">
          <span class="bar-val">[B]</span>
          <div class="bar-fill" style="height: 219px"></div>
          <span class="bar-x-label">[T2]</span>
        </div>
        <div class="bar-col">
          <span class="bar-val">[C]</span>
          <div class="bar-fill" style="height: 313px"></div>
          <span class="bar-x-label">[T3]</span>
        </div>
        <div class="bar-col">
          <span class="bar-val">[D]</span>
          <div class="bar-fill" style="height: 407px"></div>
          <span class="bar-x-label">[T4]</span>
        </div>
        <div class="bar-col">
          <span class="bar-val hi">[E]</span>
          <div class="bar-fill accent" style="height: 470px"></div>
          <span class="bar-x-label">[T5]</span>
        </div>
      </div>
      <div class="chart-baseline"></div>
    </div>
    <p class="chart-source">
      Source: [Source] · [Period]
    </p>
  </div>
  <footer class="slide-foot">
    <span class="label muted">[Organization] · [Period]</span>
    <span class="label muted page-number"></span>
  </footer>
</section>
