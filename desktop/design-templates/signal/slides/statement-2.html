<section class="slide dark slide--statement">
  <div class="slide-chrome">
    <span class="label muted">[Perspective]</span>
    <span class="label muted slide-number"></span>
  </div>
  <div class="slide-body">
    <div class="statement-body">
      <div class="kicker">
        [Kicker Label]
      </div>
      <div class="rule"></div>
      <h1 class="h1" style="max-width: 68%">
        A second statement slide can reinforce the argument with a
        sharper closing line.
      </h1>
    </div>
  </div>
  <div class="slide-foot">
    <span class="label muted"></span>
    <span class="label muted page-number"></span>
  </div>
</section>
