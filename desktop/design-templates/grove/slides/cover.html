<section class="slide dark slide--cover">

  <div class="grove-num slide-number"></div>


  <div style="
      padding-top: calc(var(--pad-y) * 1.5);
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    ">

    <div class="kicker">
      [Studio Name] · [Year]
    </div>

    <div class="rule" style="margin: var(--gap-sm) 0"></div>

    <h1 class="h1" style="max-width: 55%; margin-top: var(--gap-md)">
      [Presentation Title Goes Here]
    </h1>

    <p class="lead muted" style="max-width: 40%; margin-top: var(--gap-md)">
      A [type of work] for [audience or occasion]. [Month, Year].
    </p>
  </div>


  <div style="
      border-top: 2px solid var(--c-border);
      padding-top: var(--gap-sm);
      display: flex;
      justify-content: space-between;
    ">
    <span class="label muted">[Prepared by]</span>
    <span class="label muted">[Confidential]</span>
  </div>
</section>
