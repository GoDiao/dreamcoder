<section class="slide light slide--stats">

  <div class="slide-chrome">
    <span class="label" style="color: var(--c-fg-light-2)">By the Numbers</span>
    <span class="label page-number" style="color: var(--c-fg-light-2)"></span>
  </div>

  <div class="slide-body">

    <h2 class="h2" style="color: var(--c-fg-light)">
      THE STUDIO
    </h2>


    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value">12</div>
        <div class="stat-label" style="color: var(--c-fg-light)">
          Years of practice
        </div>
        <div class="stat-note">[Studio Name] founded [Year]</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">200+</div>
        <div class="stat-label" style="color: var(--c-fg-light)">
          Projects delivered
        </div>
        <div class="stat-note">Across [N] industries</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">3</div>
        <div class="stat-label" style="color: var(--c-fg-light)">
          Continents active
        </div>
        <div class="stat-note">[City A], [City B], [City C]</div>
      </div>
    </div>
  </div>

  <div class="slide-foot">
    <span class="label" style="color: var(--c-fg-light-3)">[Studio Name] · [Date]</span>
    <span class="label page-number" style="color: var(--c-fg-light-2)"></span>
  </div>
</section>
