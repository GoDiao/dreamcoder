<section class="slide dark slide--chart">

  <div class="slide-chrome">
    <span class="label muted">Project Output</span>
    <span class="label muted page-number"></span>
  </div>

  <div class="slide-body">
    <div class="chart-header">
      <h2 class="h2" style="color: var(--c-fg)">
        PROJECTS BY YEAR
      </h2>
      <span class="caption muted" style="
          font-family: var(--f-mono);
          text-transform: uppercase;
          letter-spacing: 0.08em;
        ">
        Count · [Studio Name] Portfolio
      </span>
    </div>

    <div class="chart-wrapper">
      <div class="bar-track">
        <div class="bar-col">
          <span class="bar-val">14</span>
          <div class="bar-fill" style="height: 86px"></div>
          <span class="bar-x-label">[Y-4]</span>
        </div>
        <div class="bar-col">
          <span class="bar-val">21</span>
          <div class="bar-fill" style="height: 130px"></div>
          <span class="bar-x-label">[Y-3]</span>
        </div>
        <div class="bar-col">
          <span class="bar-val">28</span>
          <div class="bar-fill" style="height: 184px"></div>
          <span class="bar-x-label">[Y-2]</span>
        </div>
        <div class="bar-col">
          <span class="bar-val">35</span>
          <div class="bar-fill" style="height: 238px"></div>
          <span class="bar-x-label">[Y-1]</span>
        </div>
        <div class="bar-col">

          <span class="bar-val hi">47</span>
          <div class="bar-fill accent" style="height: 324px"></div>
          <span class="bar-x-label">[Year]</span>
        </div>
      </div>
      <div class="chart-baseline"></div>
    </div>

    <p class="chart-source">
      Source: [Studio Name] internal tracking · [Year]
    </p>
  </div>

  <div class="slide-foot">
    <span class="label muted">[Studio Name] · [Date]</span>
    <span class="label muted page-number"></span>
  </div>
</section>
