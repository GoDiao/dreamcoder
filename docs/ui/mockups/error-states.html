<style>
#dc-errors{--e-bg:light-dark(#fbfaf7,#252522);--e-panel:light-dark(#f2f1ec,#2d2d29);--e-text:light-dark(#292a26,#eeeee7);--e-muted:light-dark(#74746a,#aaa99e);--e-line:light-dark(#deddd5,#45453e);--e-warn:light-dark(#91602f,#d3a16d);font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:var(--e-bg);color:var(--e-text);border-radius:12px;padding:26px;max-width:736px;margin:20px auto;color-scheme:light dark}#dc-errors *{box-sizing:border-box}#dc-errors h2{font-size:19px;font-weight:500;margin:0 0 20px}#dc-errors h3{font-size:14px;font-weight:500;margin:0}#dc-errors .example{margin-top:22px}#dc-errors .caption{font-size:12px;color:var(--e-muted);margin-bottom:8px}#dc-errors .notice{border:1px solid var(--e-line);border-radius:10px;padding:14px 16px;background:var(--e-panel);display:flex;gap:12px;align-items:flex-start}#dc-errors svg{width:17px;height:17px;flex:none;margin-top:3px;color:var(--e-warn)}#dc-errors .content{flex:1;min-width:0}#dc-errors p{margin:4px 0 10px;font-size:13px;color:var(--e-muted)}#dc-errors .actions{display:flex;gap:8px;flex-wrap:wrap}#dc-errors button{font:inherit;font-size:12px;border:1px solid var(--e-line);border-radius:6px;padding:5px 10px;background:transparent;color:var(--e-text);cursor:pointer}#dc-errors button:hover{background:var(--e-bg)}#dc-errors details{font-size:12px;color:var(--e-muted);margin:8px 0}#dc-errors summary{cursor:pointer}#dc-errors code{overflow-wrap:anywhere}#dc-errors [role=status]{font-size:12px;color:var(--e-muted);min-height:20px;margin-top:8px}#dc-errors button:focus-visible{outline:2px solid var(--e-muted);outline-offset:2px}@media(max-width:480px){#dc-errors{padding:16px}#dc-errors .notice{padding:12px}}
</style>
<div id="dc-errors" aria-label="DreamCoder 异常提示样稿"><h2>首次使用与异常</h2>
<section class="example"><div class="caption">首次使用 · 放在输入区上方</div><div class="notice"><i data-lucide="plug" aria-hidden="true"></i><div class="content"><h3>先连接一个模型服务商</h3><p>配置完成后就可以开始对话。你已输入的内容会保留。</p><div class="actions"><button data-response="进入「设置 → 模型服务商」，完成配置后返回当前会话。">配置服务商</button></div></div></div></section>
<section class="example"><div class="caption">分支切换失败 · 留在项目选择区域</div><div class="notice"><i data-lucide="git-branch" aria-hidden="true"></i><div class="content"><h3>无法切换到所选分支</h3><p>分支 feat/ui-refresh 已不存在。请选择其他分支后再启动会话。</p><div class="actions"><button data-response="重新打开分支选择器，保留当前草稿和目录。">重新选择分支</button></div></div></div></section>
<section class="example"><div class="caption">工作区冲突 · 明确原因及可选路径</div><div class="notice"><i data-lucide="triangle-alert" aria-hidden="true"></i><div class="content"><h3>当前目录有未提交的修改</h3><p>暂时无法直接切换分支。可以在独立 worktree 中启动，或先处理当前修改。</p><div class="actions"><button data-response="选用独立 worktree；仍需启动前检查通过，不自动处理当前修改。">使用独立 worktree</button><button data-response="保留草稿，返回项目选择区域。">返回</button></div></div></div></section>
<section class="example"><div class="caption">加载失败 · 只影响当前内容区域</div><div class="notice"><i data-lucide="circle-alert" aria-hidden="true"></i><div class="content"><h3>暂时无法加载会话列表</h3><p>已有内容会保留，可以稍后重试。</p><details><summary>查看详情</summary><code>连接本地服务失败，请确认服务已启动。</code></details><div class="actions"><button data-response="正在重新加载会话列表…">重试</button></div></div></div></section>
<div role="status" aria-live="polite" id="error-feedback"></div></div>
<script>
(()=>{const root=document.getElementById('dc-errors');root.addEventListener('click',e=>{const button=e.target.closest('[data-response]');if(button)root.querySelector('#error-feedback').textContent=button.dataset.response;});if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});})();
</script>
