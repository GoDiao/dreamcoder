<style>
#dc-questions{--q-bg:light-dark(#fbfaf7,#252522);--q-surface:light-dark(#f2f1ec,#2d2d29);--q-text:light-dark(#292a26,#eeeee7);--q-muted:light-dark(#74746a,#aaa99e);--q-line:light-dark(#deddd5,#45453e);--q-selected:light-dark(#e8e6de,#393931);--q-success:light-dark(#52745b,#9ab59a);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:var(--q-bg);color:var(--q-text);padding:26px;border-radius:12px;max-width:736px;margin:auto;color-scheme:light dark}
#dc-questions *{box-sizing:border-box}#dc-questions h2{font-size:19px;font-weight:500;margin:0 0 25px}#dc-questions h3{font-size:15px;font-weight:500;margin:14px 0 12px}#dc-questions .sample{margin-top:24px}#dc-questions .caption{font-size:12px;color:var(--q-muted);margin-bottom:8px}#dc-questions .question{border:1px solid var(--q-line);border-radius:12px;padding:16px 18px;background:var(--q-surface)}#dc-questions .top,#dc-questions .foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}#dc-questions .top{font-size:12px;color:var(--q-muted)}#dc-questions .grow{flex:1}#dc-questions .steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}#dc-questions button{font:inherit;color:inherit;border:0;border-radius:6px;background:transparent;padding:6px 10px;cursor:pointer}#dc-questions button:hover{background:var(--q-selected)}#dc-questions .steps button{font-size:12px}#dc-questions .steps button[aria-current=step]{background:var(--q-selected);color:var(--q-text)}#dc-questions .option{display:flex;gap:10px;align-items:flex-start;padding:9px;border-radius:7px;margin:3px 0;cursor:pointer}#dc-questions .option:has(input:checked){background:var(--q-selected)}#dc-questions input{accent-color:var(--q-text);margin:5px 0 0;flex:none}#dc-questions small{display:block;font-size:12px;color:var(--q-muted)}#dc-questions .free-label{display:block;font-size:12px;color:var(--q-muted);margin-top:12px}#dc-questions textarea{font:inherit;width:100%;background:transparent;color:var(--q-text);border:1px solid var(--q-line);border-radius:7px;resize:vertical;padding:8px 10px;margin-top:5px;min-height:40px}#dc-questions .foot{margin-top:12px;font-size:12px;color:var(--q-muted)}#dc-questions .primary{background:var(--q-text);color:var(--q-bg)}#dc-questions .primary:hover{background:var(--q-text);opacity:.9}#dc-questions button:disabled{opacity:.35;cursor:default}#dc-questions button:focus-visible,#dc-questions textarea:focus-visible{outline:2px solid var(--q-muted);outline-offset:2px}#dc-questions .done{color:var(--q-success)}#dc-questions .answer-line{display:flex;gap:16px;padding:7px 0;border-bottom:1px solid var(--q-line);font-size:13px}#dc-questions .answer-line:last-child{border-bottom:0}#dc-questions .answer-line span:first-child{color:var(--q-muted);min-width:55px}#dc-questions details{margin-top:8px;font-size:13px}#dc-questions summary{cursor:pointer;color:var(--q-muted)}#dc-questions svg{width:15px;height:15px;flex:none}#dc-questions .history{padding:12px 0;border-top:1px solid var(--q-line);border-bottom:1px solid var(--q-line)}@media(max-width:480px){#dc-questions{padding:16px}#dc-questions .question{padding:12px}#dc-questions button{min-height:36px}}
</style>
<div id="dc-questions" aria-label="DreamCoder 提问状态样稿"><h2>提问</h2><section class="sample" aria-label="多题"><div class="caption">多题 · 逐项填写，最后统一提交</div><div class="question" id="q-multiple"></div></section><section class="sample" aria-label="多选"><div class="caption">多选 · 可以选择多个选项</div><div class="question" id="q-checkboxes"></div></section><section class="sample" aria-label="已回答"><div class="caption">已回答 · 在对话中保留简洁记录</div><div class="history"><div class="top"><i data-lucide="check" aria-hidden="true"></i><span class="done">已回答</span><span class="grow"></span><span>2 个问题</span></div><div class="answer-line"><span>范围</span><span>仅桌面端</span></div><div class="answer-line"><span>方式</span><span>先完成交互样稿</span></div><details><summary>查看原问题</summary><p>这轮调整覆盖哪些端？<br>你希望先推进哪一步？</p></details></div></section></div>
<script>
(()=>{
const root=document.getElementById('dc-questions'),$=s=>root.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={step:0,answers:['',''],free:['',''],selected:[],multiFree:'',done:false,multiDone:false};
const questions=[{label:'范围',title:'这轮调整覆盖哪些端？',options:[['仅桌面端','先确定桌面端的布局与交互。'],['桌面端与手机端','同时考虑窄屏下的布局。']]},{label:'方式',title:'你希望先推进哪一步？',options:[['先完成交互样稿','确认交互后再修改应用代码。'],['开始修改应用','按已确认的设计逐步落地。']]}];
const multi=['侧栏与会话列表','提问与授权','输入区与菜单'];
function value(i){return state.free[i].trim()||state.answers[i];}
function multiValue(){return state.multiFree.trim()||state.selected.join('、');}
function save(){window.openai?.setWidgetState?.({modelContent:{design:'question-states',...state}})?.catch(()=>{});}
function restore(snapshot){const s=snapshot?.modelContent;if(!s||s.design!=='question-states')return;state.step=s.step===1?1:0;if(Array.isArray(s.answers)&&s.answers.length===2)state.answers=s.answers.map(String);if(Array.isArray(s.free)&&s.free.length===2)state.free=s.free.map(String);if(Array.isArray(s.selected))state.selected=s.selected.filter(v=>multi.includes(v));state.multiFree=typeof s.multiFree==='string'?s.multiFree:'';state.done=!!s.done;state.multiDone=!!s.multiDone;}
function render(){
const q=questions[state.step];
$('#q-multiple').innerHTML=state.done?`<div class="top done">已回答 · 2 个问题</div>${questions.map((q,i)=>`<div class="answer-line"><span>${q.label}</span><span>${esc(value(i))}</span></div>`).join('')}`:`<div class="top"><span>需要你的选择</span><span class="grow"></span><span id="single-progress">${state.answers.filter((_,i)=>value(i)).length} / 2 已填写</span></div><div class="steps">${questions.map((v,i)=>`<button data-step="${i}" aria-current="${state.step===i?'step':'false'}">${value(i)?'✓ ':''}${i+1} · ${v.label}</button>`).join('')}</div><h3>${q.title}</h3>${q.options.map(([name,desc])=>`<label class="option"><input type="radio" name="single" value="${name}" ${state.answers[state.step]===name?'checked':''}><span>${name}<small>${desc}</small></span></label>`).join('')}<label class="free-label">也可以直接填写回答<textarea id="single-free" rows="1" placeholder="输入你的想法…">${esc(state.free[state.step])}</textarea></label><div class="foot"><span class="grow">填写两题后即可提交</span>${state.step===1?'<button data-step="0">上一题</button>':'<button data-step="1">下一题</button>'}<button class="primary" id="submit-all" ${value(0)&&value(1)?'':'disabled'}>提交回答</button></div>`;
$('#q-checkboxes').innerHTML=state.multiDone?`<div class="top done">已回答</div><h3>这轮优先检查哪些区域？</h3><p>${esc(multiValue())}</p>`:`<div class="top"><span>需要你的选择</span><span class="grow"></span><span>可多选</span></div><h3>这轮优先检查哪些区域？</h3>${multi.map(name=>`<label class="option"><input type="checkbox" name="multi" value="${name}" ${state.selected.includes(name)?'checked':''}><span>${name}</span></label>`).join('')}<label class="free-label">也可以直接填写回答<textarea id="multi-free" rows="1" placeholder="输入你的想法…">${esc(state.multiFree)}</textarea></label><div class="foot"><span class="grow" id="selection-count">已选 ${state.selected.length} 项</span><button class="primary" id="submit-multi" ${multiValue()?'':'disabled'}>提交回答</button></div>`;
if(globalThis.lucide)lucide.createIcons({attrs:{width:15,height:15}});
}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.step!==undefined){state.step=Number(b.dataset.step);render();}else if(b.id==='submit-all'&&value(0)&&value(1)){state.done=true;render();}else if(b.id==='submit-multi'&&multiValue()){state.multiDone=true;render();}save();});
root.addEventListener('change',e=>{if(e.target.name==='single'){state.answers[state.step]=e.target.value;render();}if(e.target.name==='multi'){state.selected=e.target.checked?[...state.selected,e.target.value]:state.selected.filter(v=>v!==e.target.value);render();}save();});
root.addEventListener('input',e=>{if(e.target.id==='single-free'){state.free[state.step]=e.target.value;$('#submit-all').disabled=!(value(0)&&value(1));$('#single-progress').textContent=state.answers.filter((_,i)=>value(i)).length+' / 2 已填写';}if(e.target.id==='multi-free'){state.multiFree=e.target.value;$('#submit-multi').disabled=!multiValue();}save();});
restore(window.openai?.widgetState);render();window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
})();
</script>
